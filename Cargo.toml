[package]
name = "tameshi"
version = "0.1.10"
edition = "2024"
rust-version = "1.89.0"
authors = ["Pleme Team <team@pleme.io>"]
description = "Tameshi (試し) - Deterministic integrity attestation library for infrastructure layers"
license = "MIT"
repository = "https://github.com/pleme-io/tameshi"
homepage = "https://github.com/pleme-io/tameshi"
readme = "README.md"
keywords = ["attestation", "integrity", "blake3", "supply-chain", "slsa"]
categories = ["cryptography", "development-tools"]

[lib]
name = "tameshi"
path = "src/lib.rs"

[[bin]]
name = "tameshi"
path = "src/main.rs"
required-features = ["full"]

[features]
default = ["full"]
full = [
    "os-rng",
    "content-address",
    "dep:vsss-rs",
    "dep:ff",
    "dep:sha2",
    "dep:rs_merkle",
    "dep:serde_json",
    "dep:serde_norway",
    "dep:schemars",
    "dep:chrono",
    "dep:uuid",
    "dep:tokio",
    "dep:reqwest",
    "dep:object_store",
    "dep:shikumi",
    "dep:tracing",
    "dep:tempfile",
    "dep:futures",
    "dep:axum",
    "dep:clap",
]
os-rng = ["threshold", "rand_core/getrandom"]
content-address = ["dep:serde_json"]
threshold = ["dep:frost-ed25519", "dep:rand_core"]

[dependencies]
# Cryptographic hashing
blake3 = "1.8"
sha2 = { version = "0.10", optional = true }
const-hex = "1"
rs_merkle = { version = "1.4", optional = true }

# Asymmetric signing — real public-key Ed25519 for LocalSigner / SignedRoot.
# Deterministic (RFC 8032), seed-derived keypair, public-key-only verification.
# Default features keep `zeroize` (secret hygiene on SigningKey) + `fast` + `std`.
ed25519-dalek = "2"

# Threshold Ed25519: FROST(Ed25519, SHA-512), RFC 9591, Zcash Foundation.
# Wrapped by src/threshold.rs; no other module names it.
frost-ed25519 = { version = "3", default-features = false, features = ["serialization"], optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }
zeroize = "1"

# Branch-free GF(256) field for Shamir sharing (src/shamir_dfc.rs).
vsss-rs = { version = "6.0.1", default-features = false, optional = true }
ff = { version = "0.14", default-features = false, optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
serde_norway = { version = "0.9", optional = true }
schemars = { version = "0.8", features = ["chrono"], optional = true }

# Time and identifiers
chrono = { version = "0.4", features = ["serde"], optional = true }
uuid = { version = "1.16", features = ["v4", "serde"], optional = true }

# Async runtime
tokio = { version = "1.50", features = ["full"], optional = true }

# HTTP client (for OCI registry, remote endpoints)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# Object storage abstraction (S3, GCS, Azure, local) for heartbeat log forwarding
object_store = { version = "0.13", features = ["aws"], optional = true }

# Configuration (layered: defaults → YAML → envvars) via shikumi,
# the pleme-io standard. shikumi wraps figment so this crate doesn't
# have to depend on figment directly.
shikumi = { version = "0.1", optional = true }

# Error handling
thiserror = "2.0"

# Logging
tracing = { version = "0.1", optional = true }

# Temp files
tempfile = { version = "3.14", optional = true }

# Futures combinators (join_all for parallel collection)
futures = { version = "0.3", optional = true }

# HTTP server (mock Akeyless gateway for testing)
axum = { version = "0.8", optional = true }

clap = { version = "4.5", features = ["derive"], optional = true }

[lints.clippy]
pedantic = "warn"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6"

[[test]]
name = "content_address"
required-features = ["content-address"]

[[test]]
name = "artifact_matrix"
required-features = ["full"]

[[test]]
name = "e2e_attestation"
required-features = ["full"]

[[test]]
name = "e2e_gateway_attestation"
required-features = ["full"]

[[test]]
name = "exhaustive_mock_matrix"
required-features = ["full"]

[[test]]
name = "forensics_integration"
required-features = ["full"]

[[test]]
name = "full_chain_integration"
required-features = ["full"]

[[test]]
name = "proptest_properties"
required-features = ["full"]

[[test]]
name = "receipt_tuple"
required-features = ["full"]

[[test]]
name = "spec_validation"
required-features = ["full"]

[[bench]]
name = "hash"
harness = false
required-features = ["full"]

[[bench]]
name = "merkle"
harness = false
required-features = ["full"]

[[bench]]
name = "signature"
harness = false
required-features = ["full"]

[[bench]]
name = "gating"
harness = false
required-features = ["full"]

[[bench]]
name = "changeset"
harness = false
required-features = ["full"]

[[bench]]
name = "compliance"
harness = false
required-features = ["full"]

[[bench]]
name = "certification"
harness = false
required-features = ["full"]

[[bench]]
name = "verify"
harness = false
required-features = ["full"]

[[bench]]
name = "fragment"
harness = false
required-features = ["full"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[package]
name = "tameshi"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
authors = ["Pleme Team <team@pleme.io>"]
description = "Tameshi (試し) - Deterministic integrity attestation library for infrastructure layers"
license = "MIT"
repository = "https://github.com/pleme-io/tameshi"
homepage = "https://github.com/pleme-io/tameshi"
readme = "README.md"
keywords = ["attestation", "integrity", "blake3", "supply-chain", "slsa"]
categories = ["cryptography", "development-tools"]

[lib]
name = "tameshi"
path = "src/lib.rs"

[dependencies]
# Cryptographic hashing
blake3 = "1.8"
sha2 = "0.10"
const-hex = "1"
rs_merkle = "1.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"

# Time and identifiers
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "serde"] }

# Async runtime
tokio = { version = "1.50", features = ["full"] }

# HTTP client (for OCI registry, remote endpoints)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Configuration (layered: defaults → YAML → envvars)
figment = { version = "0.10", features = ["yaml", "env"] }

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"

# Temp files
tempfile = "3.14"

# Futures combinators (join_all for parallel collection)
futures = "0.3"

[lints.clippy]
pedantic = "warn"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[package]
name = "tameshi"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
authors = ["Pleme Team <team@pleme.io>"]
description = "Tameshi (試し) - Deterministic integrity attestation library for infrastructure layers"
license = "MIT"
repository = "https://github.com/pleme-io/tameshi"
homepage = "https://github.com/pleme-io/tameshi"
readme = "README.md"
keywords = ["attestation", "integrity", "blake3", "supply-chain", "slsa"]
categories = ["cryptography", "development-tools"]

[lib]
name = "tameshi"
path = "src/lib.rs"

[dependencies]
# Cryptographic hashing
blake3 = "1.8"
sha2 = "0.10"
const-hex = "1"
rs_merkle = "1.4"

# Asymmetric signing — real public-key Ed25519 for LocalSigner / SignedRoot.
# Deterministic (RFC 8032), seed-derived keypair, public-key-only verification.
# Default features keep `zeroize` (secret hygiene on SigningKey) + `fast` + `std`.
ed25519-dalek = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
schemars = { version = "0.8", features = ["chrono"] }

# Time and identifiers
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "serde"] }

# Async runtime
tokio = { version = "1.50", features = ["full"] }

# HTTP client (for OCI registry, remote endpoints)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Object storage abstraction (S3, GCS, Azure, local) for heartbeat log forwarding
object_store = { version = "0.13", features = ["aws"] }

# Configuration (layered: defaults → YAML → envvars) via shikumi,
# the pleme-io standard. shikumi wraps figment so this crate doesn't
# have to depend on figment directly.
shikumi = { git = "https://github.com/pleme-io/shikumi" }

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"

# Temp files
tempfile = "3.14"

# Futures combinators (join_all for parallel collection)
futures = "0.3"

# HTTP server (mock Akeyless gateway for testing)
axum = "0.8"

[lints.clippy]
pedantic = "warn"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6"

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "merkle"
harness = false

[[bench]]
name = "signature"
harness = false

[[bench]]
name = "gating"
harness = false

[[bench]]
name = "changeset"
harness = false

[[bench]]
name = "compliance"
harness = false

[[bench]]
name = "certification"
harness = false

[[bench]]
name = "verify"
harness = false

[[bench]]
name = "fragment"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

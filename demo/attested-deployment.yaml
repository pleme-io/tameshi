apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-service
  namespace: default
  annotations:
    sekiban.pleme.io/signature: "blake3:a1b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5f67890"
    sekiban.pleme.io/certification-hash: "blake3:f6e5d4c3b2a10987f6e5d4c3b2a10987f6e5d4c3b2a10987f6e5d4c3b2a10987"
    sekiban.pleme.io/compliance-hash: "blake3:1a2b3c4d5e6f78901a2b3c4d5e6f78901a2b3c4d5e6f78901a2b3c4d5e6f7890"
    sekiban.pleme.io/target-attestation-hash: "blake3:9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b"
  labels:
    app: my-service
    attestation: verified
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-service
  template:
    metadata:
      labels:
        app: my-service
    spec:
      containers:
        - name: my-service
          image: ghcr.io/pleme-io/my-service:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: AKEYLESS_GATEWAY_URL
              value: "https://gw.akeyless.io"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: akeyless-db-password
                  key: password

apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-service
  namespace: default
  labels:
    app: my-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-service
  template:
    metadata:
      labels:
        app: my-service
    spec:
      containers:
        - name: my-service
          image: ghcr.io/pleme-io/my-service:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: SECRETS_GATEWAY_URL
              value: "https://gw.secrets.example.com"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets-db-password
                  key: password

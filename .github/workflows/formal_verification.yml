name: Formal Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  proptest:
    name: "Layer 1: Property-Based Testing (100K+ inputs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib -- --test-threads=4
      - run: cargo test --test proptest_properties

  kani:
    name: "Layer 2: Bounded Model Checking (Kani)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-verifier-action@v1
      - run: cargo kani --manifest-path proofs/kani/Cargo.toml

  fstar:
    name: "Layer 3: Formal Proofs (F*)"
    runs-on: ubuntu-latest
    container: fstarlang/fstar:latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd fstar
          for f in *.fst; do
            echo "Verifying $f..."
            fstar.exe --include . "$f"
          done

  integration:
    name: "E2E Cross-Repository Attestation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo test --test e2e_gateway_attestation
          cargo test --test e2e_attestation
          cargo test --test full_chain_integration
          cargo test --test forensics_integration

  bpf-struct-layout:
    name: "BPF Struct Layout Verification"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib bpf_loader

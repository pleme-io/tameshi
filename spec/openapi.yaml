openapi: 3.0.3
info:
  title: Tameshi Attestation Platform API
  version: 0.1.0
  description: |
    Deterministic integrity attestation and compliance verification for infrastructure.

    Tameshi unifies two complementary services:

    - **sekiban** -- Kubernetes integrity gating via deterministic BLAKE3 signature
      verification across infrastructure layers (Nix, OCI, Helm, Tofu, etc.).
    - **kensa** -- Compliance engine that runs NIST/OSCAL assessments and drives a
      multi-stage product certification pipeline.

    Together they provide a cryptographically verifiable chain from source code
    through build, image, chart, deployment, and compliance -- producing a single
    certification hash that attests the entire stack.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: pleme-io
    url: https://github.com/pleme-io/tameshi

servers:
  - url: http://localhost:8080
    description: sekiban API -- signature gates, certifications, audit
  - url: http://localhost:8081
    description: kensa API -- compliance engine, reports, certification pipeline

tags:
  - name: gates
    description: Signature gate management (sekiban)
  - name: certifications
    description: Environment certification (sekiban)
  - name: audit
    description: Audit trail (sekiban)
  - name: signatures
    description: Signature computation (sekiban)
  - name: compliance
    description: Compliance results (kensa)
  - name: reports
    description: Compliance reports (kensa)
  - name: certification-pipeline
    description: Product certification pipeline (kensa)
  - name: heartbeat
    description: Heartbeat proof chain for admission and compliance events
  - name: collectors
    description: Infrastructure layer hash collectors
  - name: signing
    description: Merkle root signing and verification
  - name: compliance-query
    description: Compliance state and distance queries
  - name: forensics
    description: Forensic blast radius analysis, timeline provenance, and incident response
  - name: global
    description: Global state root aggregation across federated clusters
  - name: health
    description: Health and readiness probes

paths:
  # ---------------------------------------------------------------------------
  # Sekiban -- Gates
  # ---------------------------------------------------------------------------
  /api/v1/gates:
    get:
      operationId: listGates
      summary: List all signature gates
      description: Returns a summary of every SignatureGate resource across all namespaces.
      tags: [gates]
      responses:
        "200":
          description: List of gate summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GateSummary"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/gates/{name}:
    get:
      operationId: getGate
      summary: Get a signature gate by name
      description: Returns the full SignatureGate resource including spec and status.
      tags: [gates]
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the SignatureGate resource
          schema:
            type: string
      responses:
        "200":
          description: The requested signature gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignatureGate"
        "404":
          description: Gate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/gates/{name}/verify:
    get:
      operationId: verifyGate
      summary: Verify a signature gate
      description: |
        Triggers an immediate verification of the gate by recomputing each layer
        hash and comparing the composite signature against the expected value.
      tags: [gates]
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the SignatureGate resource to verify
          schema:
            type: string
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateVerifyResult"
        "404":
          description: Gate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Sekiban -- Certifications
  # ---------------------------------------------------------------------------
  /api/v1/certifications:
    get:
      operationId: listCertifications
      summary: List all certifications
      description: Returns a summary of every Certification resource across all namespaces.
      tags: [certifications]
      responses:
        "200":
          description: List of certification summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CertificationSummary"

  /api/v1/certifications/{name}:
    get:
      operationId: getCertification
      summary: Get certification by name
      description: Returns the full Certification resource including spec and status.
      tags: [certifications]
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the Certification resource
          schema:
            type: string
      responses:
        "200":
          description: The requested certification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"
        "404":
          description: Certification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Sekiban -- Audit
  # ---------------------------------------------------------------------------
  /api/v1/audit/{environment}:
    get:
      operationId: getAuditTrail
      summary: Get audit trail for environment
      description: Returns the ordered list of audit entries for the specified environment.
      tags: [audit]
      parameters:
        - name: environment
          in: path
          required: true
          description: Environment name (e.g. plo, zek)
          schema:
            type: string
      responses:
        "200":
          description: Audit trail entries in chronological order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"

  # ---------------------------------------------------------------------------
  # Sekiban -- Signatures
  # ---------------------------------------------------------------------------
  /api/v1/signatures/compute:
    post:
      operationId: computeSignature
      summary: Compute a signature
      description: |
        Computes a deterministic BLAKE3 composite signature from the requested
        infrastructure layers for the given environment.
      tags: [signatures]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputeSignatureRequest"
      responses:
        "200":
          description: Computed signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputeSignatureResponse"

  # ---------------------------------------------------------------------------
  # Kensa -- Compliance Results
  # ---------------------------------------------------------------------------
  /api/v1/compliance/results:
    get:
      operationId: listComplianceResults
      summary: List compliance results
      description: Returns summaries of all compliance assessment results.
      tags: [compliance]
      responses:
        "200":
          description: List of compliance result summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseResultSummaryList"

  /api/v1/compliance/results/{id}:
    get:
      operationId: getComplianceResult
      summary: Get compliance result by ID
      description: Returns the full compliance result including assessment details.
      tags: [compliance]
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the compliance result
          schema:
            type: string
      responses:
        "200":
          description: The requested compliance result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceResult"
        "404":
          description: Compliance result not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/compliance/hash:
    get:
      operationId: getComplianceHash
      summary: Get latest compliance hash
      description: Returns the BLAKE3 hash of the most recent compliance assessment.
      tags: [compliance]
      responses:
        "200":
          description: Latest compliance hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseHashResponse"

  /api/v1/compliance/run:
    post:
      operationId: runComplianceAssessment
      summary: Run compliance assessment
      description: Triggers a new compliance assessment run against the configured baseline.
      tags: [compliance]
      responses:
        "200":
          description: Assessment run initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRunResponse"

  # ---------------------------------------------------------------------------
  # Kensa -- Reports
  # ---------------------------------------------------------------------------
  /api/v1/compliance/report:
    get:
      operationId: getComplianceReport
      summary: Generate compliance report
      description: |
        Generates a compliance report in the requested format. Supports OSCAL
        and NIST output formats.
      tags: [reports]
      parameters:
        - name: format
          in: query
          required: false
          description: Report output format
          schema:
            type: string
            enum: [oscal, nist]
            default: oscal
      responses:
        "200":
          description: Generated compliance report
          content:
            application/json:
              schema:
                type: object
                description: Report content in the requested format (OSCAL or NIST JSON)
        "400":
          description: Invalid format parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Kensa -- Certification Pipeline
  # ---------------------------------------------------------------------------
  /api/v1/compliance/certify:
    post:
      operationId: certifyProduct
      summary: Certify a product
      description: |
        Runs the multi-stage certification pipeline for a product deployment.
        Evaluates source, build, image, chart, and deployment attestations
        against the specified policy, producing a deterministic certification hash.
      tags: [certification-pipeline]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertifyRequest"
      responses:
        "200":
          description: Certification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCertifyResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Heartbeat Chain
  # ---------------------------------------------------------------------------
  /api/v1/heartbeat/chain:
    get:
      operationId: getHeartbeatChain
      summary: Get heartbeat chain entries
      description: |
        Returns heartbeat proof chain entries within the specified sequence range.
        Each entry is BLAKE3-linked to its predecessor, forming a tamper-evident log
        of admission decisions, compliance assessments, and certification events.
      tags: [heartbeat]
      parameters:
        - name: from_seq
          in: query
          required: false
          description: Starting sequence number (inclusive)
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: to_seq
          in: query
          required: false
          description: Ending sequence number (inclusive)
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of entries to return
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 100
      responses:
        "200":
          description: Heartbeat chain entries in sequence order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeartbeatEntry"
        "400":
          description: Invalid sequence range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/heartbeat/consistency-proof:
    get:
      operationId: getHeartbeatConsistencyProof
      summary: Get consistency proof between two chain states
      description: |
        Generates a consistency proof demonstrating that the heartbeat chain at
        sequence `from_seq` is a prefix of the chain at sequence `to_seq`. The
        proof consists of BLAKE3 intermediate nodes that can be independently
        verified without downloading the full chain.
      tags: [heartbeat]
      parameters:
        - name: from_seq
          in: query
          required: true
          description: Earlier sequence number
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: to_seq
          in: query
          required: true
          description: Later sequence number
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: Consistency proof between the two chain states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyProof"
        "400":
          description: Invalid sequence range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/heartbeat/verify:
    post:
      operationId: verifyHeartbeatConsistencyProof
      summary: Verify a consistency proof
      description: |
        Verifies that a consistency proof is valid by recomputing the expected
        hashes from the proof nodes and comparing them against the provided
        expected hashes.
      tags: [heartbeat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsistencyProofVerifyRequest"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required:
                  - verified
                properties:
                  verified:
                    type: boolean
                    description: Whether the consistency proof is valid
                  error:
                    type: string
                    nullable: true
                    description: Error message if verification failed
        "400":
          description: Invalid proof data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Collectors -- Helm Rendered Hashing
  # ---------------------------------------------------------------------------
  /api/v1/collectors/helm/render:
    post:
      operationId: hashHelmRender
      summary: Hash a rendered Helm chart
      description: |
        Renders a Helm chart with the specified values files and computes a
        deterministic BLAKE3 hash of the rendered output. Returns a full
        LayerSignature for the Helm layer.
      tags: [collectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelmRenderRequest"
      responses:
        "200":
          description: Layer signature for the rendered Helm chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerSignature"
        "400":
          description: Invalid request (missing chart or values)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Helm render failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Signing
  # ---------------------------------------------------------------------------
  /api/v1/signing/sign:
    post:
      operationId: signMerkleRoot
      summary: Sign a Merkle root
      description: |
        Signs a BLAKE3 Merkle root using the specified algorithm. Supports local
        Ed25519 signing and Akeyless DFC (Dynamic Fragment Cryptography) for
        remote key management.
      tags: [signing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignRequest"
      responses:
        "200":
          description: Signed root with signature and signer metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedRoot"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Signing operation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/signing/verify:
    post:
      operationId: verifySignedRoot
      summary: Verify a signed root
      description: |
        Verifies the signature on a signed Merkle root. The algorithm and key
        identity are embedded in the SignedRoot object.
      tags: [signing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignedRoot"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required:
                  - verified
                properties:
                  verified:
                    type: boolean
                    description: Whether the signed root is valid
        "400":
          description: Invalid signed root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Compliance Query
  # ---------------------------------------------------------------------------
  /api/v1/compliance/state:
    get:
      operationId: getComplianceState
      summary: Get current compliance state
      description: |
        Returns the current aggregate compliance state including status, distance
        from target baseline, active frameworks, and the latest compliance hash.
      tags: [compliance-query]
      responses:
        "200":
          description: Current compliance state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceState"
        "500":
          description: Failed to compute compliance state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/compliance/distance:
    get:
      operationId: getComplianceDistance
      summary: Get compliance distance from target baseline
      description: |
        Computes the gap between the current compliance state and the target
        baseline for the specified framework. Returns the number of controls
        required, satisfied, and the gap percentage.
      tags: [compliance-query]
      parameters:
        - name: baseline
          in: query
          required: true
          description: Target baseline level
          schema:
            type: string
            enum: [low, moderate, high]
        - name: framework
          in: query
          required: true
          description: Compliance framework to measure against
          schema:
            type: string
            enum: [nist, oscal, soc2, pci, fedramp, stig]
      responses:
        "200":
          description: Compliance distance metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceDistance"
        "400":
          description: Invalid baseline or framework
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Forensics -- Blast Radius, Timeline, Provenance, Revocation
  # ---------------------------------------------------------------------------
  /api/v1/forensics/blast-radius:
    get:
      operationId: getBlastRadius
      summary: Query blast radius for a compromised hash
      description: |
        Searches the MerkleLedger for every deployment that contained the specified
        BLAKE3 hash. Returns affected nodes, pods, namespaces, temporal range, and
        co-resident artifacts that shared the same Merkle root. Designed for CIRCIA
        72-hour incident response.
      tags: [forensics]
      parameters:
        - name: hash
          in: query
          required: true
          description: BLAKE3 hash of the compromised artifact (prefixed, e.g. blake3:abc...)
          schema:
            $ref: "#/components/schemas/Blake3Hash"
        - name: from
          in: query
          required: false
          description: Start of the time window (default 72 hours ago)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: End of the time window (default now)
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Blast radius report for the compromised hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlastRadiusResponse"
        "400":
          description: Invalid hash format or time range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Hash not found in ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/forensics/timeline:
    get:
      operationId: getForensicsTimeline
      summary: Get chronological event stream for a hash
      description: |
        Returns a chronological list of every verification event that involved the
        specified BLAKE3 hash. Each event includes the timestamp, decision, node,
        pod, binary path, composed root, and ledger sequence number.
      tags: [forensics]
      parameters:
        - name: hash
          in: query
          required: true
          description: BLAKE3 hash to trace through the ledger
          schema:
            $ref: "#/components/schemas/Blake3Hash"
        - name: from
          in: query
          required: false
          description: Start of the time window (default 72 hours ago)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: End of the time window (default now)
          schema:
            type: string
            format: date-time
        - name: node
          in: query
          required: false
          description: Filter events to a specific node
          schema:
            type: string
      responses:
        "200":
          description: Timeline of verification events for the hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
        "400":
          description: Invalid hash format or time range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/forensics/provenance:
    get:
      operationId: getForensicsProvenance
      summary: Get point-in-time artifact stack for a node
      description: |
        Returns all CertificationArtifacts that were active on the specified node
        at the given timestamp, including their full Merkle trees, signed roots,
        and deployment contexts.
      tags: [forensics]
      parameters:
        - name: node
          in: query
          required: true
          description: Node name to query
          schema:
            type: string
        - name: at
          in: query
          required: true
          description: Point-in-time timestamp
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Active artifacts on the node at the given timestamp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvenanceResponse"
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/forensics/revoke:
    post:
      operationId: revokeHash
      summary: Emergency revocation of a compromised hash
      description: |
        Revokes a compromised BLAKE3 hash across all nodes. Updates kanshi BPF
        allow-maps to block execution of the compromised binary and records a
        Revocation event in the HeartbeatChain for audit purposes.
      tags: [forensics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
      responses:
        "200":
          description: Revocation result with affected node count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Revocation partially failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Global -- Federated State Root, Cross-Cluster Blast Radius
  # ---------------------------------------------------------------------------
  /api/v1/global/state-root:
    get:
      operationId: getGlobalStateRoot
      summary: Get the current global state root
      description: |
        Returns the global state root aggregating all cluster roots. The root
        hash is a BLAKE3 Merkle root computed from all cluster roots in
        deterministic BTreeMap order.
      tags: [global]
      responses:
        "200":
          description: Global state root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalStateRootResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/global/blast-radius:
    get:
      operationId: getGlobalBlastRadius
      summary: Global blast radius for a compromised hash
      description: |
        Aggregates blast radius reports from all clusters for a given
        compromised BLAKE3 hash. Returns per-cluster and per-node breakdowns,
        total affected counts, and first/last seen timestamps globally.
      tags: [global]
      parameters:
        - name: hash
          in: query
          required: true
          description: BLAKE3 hash (prefixed) of the compromised artifact
          schema:
            type: string
            pattern: "^blake3:[a-f0-9]{64}$"
        - name: from
          in: query
          required: false
          description: Start of time range (ISO 8601). Defaults to 24h ago.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: End of time range (ISO 8601). Defaults to now.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Global blast radius report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalBlastRadiusResponse"
        "400":
          description: Invalid hash format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/global/clusters:
    get:
      operationId: listGlobalClusters
      summary: List all clusters reporting to the global state
      description: |
        Returns a list of all clusters that have reported their state root,
        including liveness status, node count, and artifact count.
      tags: [global]
      responses:
        "200":
          description: List of cluster root entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClusterRootEntry"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/global/clusters/{id}/state:
    get:
      operationId: getClusterState
      summary: Get a specific cluster's state
      description: |
        Returns the full state entry for a specific cluster, including its
        signed root, node count, artifact count, and liveness status.
      tags: [global]
      parameters:
        - name: id
          in: path
          required: true
          description: Unique cluster identifier
          schema:
            type: string
      responses:
        "200":
          description: Cluster state entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterRootEntry"
        "404":
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/global/clusters/{id}/report:
    post:
      operationId: reportClusterRoot
      summary: Report a cluster's state root
      description: |
        Accepts a cluster root report from a local cluster, including its
        signed Merkle root, node count, artifact count, and optional delta
        of changed artifacts since the last report.
      tags: [global]
      parameters:
        - name: id
          in: path
          required: true
          description: Unique cluster identifier (must match report body)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterRootReport"
      responses:
        "200":
          description: Report accepted, returns updated global state root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalStateRootResponse"
        "400":
          description: Invalid report or cluster ID mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/global/history:
    get:
      operationId: getGlobalHistory
      summary: Get global state root history
      description: |
        Returns the history of global state root changes, ordered by
        sequence number. Each entry includes the root hash, cluster
        composition, and timestamp.
      tags: [global]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of history entries to return. Defaults to 100.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: from_sequence
          in: query
          required: false
          description: Return entries starting from this sequence number.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: List of historical global state roots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GlobalStateRootResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/global/revoke-everywhere:
    post:
      operationId: globalRevokeEverywhere
      summary: Revoke a compromised hash across all clusters
      description: |
        Broadcasts a revocation command to all active clusters, updating
        their kanshi BPF allow-maps to block execution of the compromised
        binary. Returns aggregate results from all clusters.
      tags: [global]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
      responses:
        "200":
          description: Global revocation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalRevokeResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Revocation partially failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      description: Returns 200 when the service process is alive.
      tags: [health]
      responses:
        "200":
          description: Service is alive

  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      description: Returns 200 when the service is ready to accept traffic, 503 otherwise.
      tags: [health]
      responses:
        "200":
          description: Service is ready
        "503":
          description: Service is not ready

components:
  schemas:
    # =========================================================================
    # Core Types
    # =========================================================================
    Blake3Hash:
      type: string
      pattern: "^blake3:[a-f0-9]{64}$"
      description: BLAKE3 hash in prefixed hex format
      example: "blake3:af1349b9f5f9a1a6a0404dea36dcc9499bcb25c9adc112b7cc9a93cae41f3262"

    LayerType:
      type: string
      enum:
        - nix
        - oci
        - helm
        - tofu
        - kubernetes
        - kindling
        - tatara
        - fluxcd
        - argocd
        - akeyless
        - akeyless_target
        - pangea_synthesis
        - rspec_result
        - inspec_result
      description: Infrastructure layer type used for signature computation

    # =========================================================================
    # Gate Types
    # =========================================================================
    GateSummary:
      type: object
      description: Abbreviated view of a SignatureGate for list responses
      required:
        - name
        - namespace
        - phase
        - layers
      properties:
        name:
          type: string
          description: Name of the SignatureGate resource
        namespace:
          type: string
          description: Kubernetes namespace
        phase:
          $ref: "#/components/schemas/GatePhase"
        layers:
          type: array
          items:
            $ref: "#/components/schemas/LayerType"
          description: Infrastructure layers this gate covers
        expectedSignature:
          type: string
          nullable: true
          description: Expected composite signature
        currentSignature:
          type: string
          nullable: true
          description: Most recently computed composite signature

    SignatureGate:
      type: object
      description: Full SignatureGate resource with spec and status
      required:
        - name
        - namespace
        - spec
        - status
      properties:
        name:
          type: string
          description: Name of the SignatureGate resource
        namespace:
          type: string
          description: Kubernetes namespace
        spec:
          $ref: "#/components/schemas/SignatureGateSpec"
        status:
          $ref: "#/components/schemas/SignatureGateStatus"

    SignatureGateSpec:
      type: object
      description: Desired state of a SignatureGate
      required:
        - layers
        - expectedSignature
      properties:
        layers:
          type: array
          items:
            $ref: "#/components/schemas/LayerType"
          description: Infrastructure layers to include in signature computation
        expectedSignature:
          type: string
          description: Expected deterministic composite signature
        targetResources:
          type: array
          items:
            $ref: "#/components/schemas/TargetResource"
          description: Kubernetes resources this gate controls admission for
        compliancePolicy:
          type: string
          nullable: true
          description: Name of the CertificationPolicy to enforce
        expectedCertificationHash:
          type: string
          nullable: true
          description: Expected certification hash from the compliance engine
        verificationIntervalSecs:
          type: integer
          nullable: true
          description: How often to re-verify the gate in seconds

    SignatureGateStatus:
      type: object
      description: Observed state of a SignatureGate
      required:
        - phase
      properties:
        phase:
          $ref: "#/components/schemas/GatePhase"
        currentSignature:
          type: string
          nullable: true
          description: Most recently computed composite signature
        lastVerifiedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last successful verification
        layerStatuses:
          type: array
          items:
            $ref: "#/components/schemas/LayerStatus"
          description: Per-layer verification status
        message:
          type: string
          nullable: true
          description: Human-readable status message
        failureCount:
          type: integer
          nullable: true
          description: Number of consecutive verification failures
        admissionDecisions:
          $ref: "#/components/schemas/AdmissionDecisionCounts"

    GatePhase:
      type: string
      enum: [Pending, Verified, Failed, Stale]
      description: Current phase of a signature gate

    TargetResource:
      type: object
      description: Kubernetes resource targeted by a gate for admission control
      required:
        - group
        - kind
        - operations
      properties:
        group:
          type: string
          description: API group (e.g. apps, batch, empty string for core)
        kind:
          type: string
          description: Resource kind (e.g. Deployment, Job)
        operations:
          type: array
          items:
            type: string
          description: Admission operations to intercept (CREATE, UPDATE, DELETE)

    LayerStatus:
      type: object
      description: Verification status for a single infrastructure layer
      required:
        - layer
        - hash
        - verified
      properties:
        layer:
          $ref: "#/components/schemas/LayerType"
        hash:
          type: string
          description: Computed BLAKE3 hash for this layer
        verified:
          type: boolean
          description: Whether the layer hash matches the expected value
        lastVerifiedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last verification for this layer
        error:
          type: string
          nullable: true
          description: Error message if verification failed

    AdmissionDecisionCounts:
      type: object
      description: Running counts of admission decisions made by this gate
      properties:
        allowed:
          type: integer
          description: Number of requests allowed through the gate
        denied:
          type: integer
          description: Number of requests denied by the gate

    GateVerifyResult:
      type: object
      description: Result of an on-demand gate verification
      required:
        - name
        - verified
        - phase
      properties:
        name:
          type: string
          description: Name of the verified gate
        verified:
          type: boolean
          description: Whether the gate passed verification
        phase:
          $ref: "#/components/schemas/GatePhase"
        expectedSignature:
          type: string
          nullable: true
          description: The expected composite signature
        currentSignature:
          type: string
          nullable: true
          description: The freshly computed composite signature
        layerStatuses:
          type: array
          items:
            $ref: "#/components/schemas/LayerStatus"
          description: Per-layer verification results

    # =========================================================================
    # Certification Types
    # =========================================================================
    CertificationSummary:
      type: object
      description: Abbreviated view of a Certification for list responses
      required:
        - name
        - namespace
        - environment
        - phase
      properties:
        name:
          type: string
          description: Name of the Certification resource
        namespace:
          type: string
          description: Kubernetes namespace
        environment:
          type: string
          description: Target environment (e.g. plo, zek)
        phase:
          $ref: "#/components/schemas/CertPhase"
        gates:
          type: array
          items:
            type: string
          description: Names of the SignatureGates included in this certification
        masterSignature:
          type: string
          nullable: true
          description: Composite master signature across all gates

    Certification:
      type: object
      description: Full Certification resource with spec and status
      required:
        - name
        - namespace
        - spec
        - status
      properties:
        name:
          type: string
          description: Name of the Certification resource
        namespace:
          type: string
          description: Kubernetes namespace
        spec:
          $ref: "#/components/schemas/CertificationSpec"
        status:
          $ref: "#/components/schemas/CertificationStatus"

    CertificationSpec:
      type: object
      description: Desired state of a Certification
      required:
        - environment
        - gates
      properties:
        environment:
          type: string
          description: Target environment name
        gates:
          type: array
          items:
            type: string
          description: Names of SignatureGate resources to include
        auditRetentionDays:
          type: integer
          nullable: true
          description: Number of days to retain audit trail entries

    CertificationStatus:
      type: object
      description: Observed state of a Certification
      required:
        - phase
      properties:
        phase:
          $ref: "#/components/schemas/CertPhase"
        masterSignature:
          type: string
          nullable: true
          description: Composite master signature across all gates
        complianceSignature:
          type: string
          nullable: true
          description: BLAKE3 hash of the compliance assessment result
        secureSignature:
          type: string
          nullable: true
          description: BLAKE3 hash combining master and compliance signatures
        lastCertifiedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last successful certification
        gateStatuses:
          type: array
          items:
            $ref: "#/components/schemas/GateStatusRef"
          description: Status of each gate included in this certification
        auditTrail:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
          description: Ordered audit trail for this certification

    CertPhase:
      type: string
      enum: [Pending, Certified, Degraded, Failed]
      description: Current phase of a certification

    GateStatusRef:
      type: object
      description: Reference to a gate's status within a certification
      required:
        - name
        - verified
        - phase
      properties:
        name:
          type: string
          description: Name of the referenced SignatureGate
        verified:
          type: boolean
          description: Whether the gate is currently verified
        phase:
          $ref: "#/components/schemas/GatePhase"
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last status check

    # =========================================================================
    # Audit Types
    # =========================================================================
    AuditEntry:
      type: object
      description: Single entry in the audit trail
      required:
        - timestamp
        - action
        - signature
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the audit event occurred
        action:
          $ref: "#/components/schemas/AuditAction"
        signature:
          type: string
          description: Signature associated with this audit event
        details:
          type: string
          nullable: true
          description: Human-readable details about the event
        resource:
          type: string
          nullable: true
          description: Kubernetes resource involved (e.g. apps/v1/Deployment/my-app)
        allowed:
          type: boolean
          nullable: true
          description: Whether the operation was allowed (for admission events)

    AuditAction:
      type: string
      enum:
        - SignatureComputed
        - SignatureVerified
        - VerificationFailed
        - ComplianceTestRun
        - Certified
        - Degraded
        - GateAllowed
        - GateDenied
      description: Type of audit action

    # =========================================================================
    # Signature Types
    # =========================================================================
    ComputeSignatureRequest:
      type: object
      description: Request to compute a deterministic composite signature
      required:
        - layers
        - environment
      properties:
        layers:
          type: array
          items:
            $ref: "#/components/schemas/LayerType"
          description: Infrastructure layers to include in the computation
        environment:
          type: string
          description: Target environment name

    ComputeSignatureResponse:
      type: object
      description: Result of a signature computation
      required:
        - signature
        - layers
        - environment
      properties:
        signature:
          type: string
          description: Computed BLAKE3 composite signature
        layers:
          type: array
          items:
            type: string
          description: Layer types that contributed to the signature
        environment:
          type: string
          description: Environment the signature was computed for

    LayerSignature:
      type: object
      description: Signature data for a single infrastructure layer
      required:
        - layer
        - hash
        - metadata
        - inputs
      properties:
        layer:
          $ref: "#/components/schemas/LayerType"
        hash:
          type: string
          description: BLAKE3 hash of all inputs for this layer
        metadata:
          $ref: "#/components/schemas/SignatureMetadata"
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/InputHash"
          description: Individual input hashes that compose this layer signature

    SignatureMetadata:
      type: object
      description: Metadata about a signature computation
      required:
        - computedAt
        - collectorVersion
        - source
      properties:
        computedAt:
          type: string
          format: date-time
          description: Timestamp when the signature was computed
        collectorVersion:
          type: string
          description: Version of the collector that produced this signature
        source:
          type: string
          description: Identifier for the source that produced the inputs
        environment:
          type: string
          nullable: true
          description: Environment context for the computation

    InputHash:
      type: object
      description: Hash of a single input artifact within a layer
      required:
        - name
        - hash
      properties:
        name:
          type: string
          description: Logical name of the input artifact
        hash:
          type: string
          description: BLAKE3 hash of the input content
        size:
          type: integer
          nullable: true
          description: Size of the input in bytes

    MasterSignature:
      type: object
      description: Composite master signature across all infrastructure layers
      required:
        - untested
        - layers
        - computedAt
        - environment
      properties:
        untested:
          type: string
          description: Raw composite hash before compliance or security attestation
        compliance:
          type: string
          nullable: true
          description: Hash incorporating compliance assessment results
        secure:
          type: string
          nullable: true
          description: Hash incorporating security scan results
        layers:
          type: array
          items:
            $ref: "#/components/schemas/LayerSignature"
          description: Per-layer signatures that compose the master
        computedAt:
          type: string
          format: date-time
          description: Timestamp when the master signature was computed
        environment:
          type: string
          description: Environment the master signature covers

    # =========================================================================
    # Compliance Types
    # =========================================================================
    ResultSummary:
      type: object
      description: Abbreviated view of a compliance result
      required:
        - id
        - environment
        - baseline
        - complianceHash
        - allSatisfied
        - totalControls
        - satisfied
        - notSatisfied
        - performedAt
      properties:
        id:
          type: string
          description: Unique identifier for this compliance result
        environment:
          type: string
          description: Environment that was assessed
        baseline:
          $ref: "#/components/schemas/ComplianceBaseline"
        complianceHash:
          type: string
          description: BLAKE3 hash of the assessment result
        allSatisfied:
          type: boolean
          description: Whether all controls are satisfied
        totalControls:
          type: integer
          description: Total number of controls assessed
        satisfied:
          type: integer
          description: Number of satisfied controls
        notSatisfied:
          type: integer
          description: Number of unsatisfied controls
        performedAt:
          type: string
          format: date-time
          description: When the assessment was performed

    ComplianceResult:
      type: object
      description: Full compliance assessment result
      required:
        - id
        - environment
        - baseline
        - frameworkHash
        - catalogHash
        - assessmentResult
        - complianceHash
        - allSatisfied
        - computedAt
      properties:
        id:
          type: string
          description: Unique identifier for this compliance result
        environment:
          type: string
          description: Environment that was assessed
        baseline:
          $ref: "#/components/schemas/ComplianceBaseline"
        frameworkHash:
          type: string
          description: BLAKE3 hash of the compliance framework definition
        catalogHash:
          type: string
          description: BLAKE3 hash of the control catalog
        assessmentResult:
          type: object
          description: Full OSCAL assessment result object
        complianceHash:
          type: string
          description: BLAKE3 hash of the entire assessment result
        allSatisfied:
          type: boolean
          description: Whether all controls are satisfied
        computedAt:
          type: string
          format: date-time
          description: When the result was computed

    HashResponse:
      type: object
      description: Latest compliance hash information
      required:
        - complianceHash
        - environment
        - baseline
        - computedAt
      properties:
        complianceHash:
          type: string
          description: BLAKE3 hash of the most recent compliance assessment
        environment:
          type: string
          description: Environment of the assessment
        baseline:
          $ref: "#/components/schemas/ComplianceBaseline"
        computedAt:
          type: string
          format: date-time
          description: When the hash was computed

    RunResponse:
      type: object
      description: Response from triggering a compliance assessment
      required:
        - status
        - message
      properties:
        status:
          type: string
          description: Status of the run (e.g. started, completed)
        message:
          type: string
          description: Human-readable message about the run

    ComplianceBaseline:
      type: string
      enum: [low, moderate, high]
      description: NIST compliance baseline level

    # =========================================================================
    # Certification Pipeline Types
    # =========================================================================
    CertifyRequest:
      type: object
      description: Request to certify a product deployment through the multi-stage pipeline
      required:
        - product
        - environment
        - cluster
        - source
        - builds
        - images
        - charts
        - deployment
      properties:
        product:
          type: string
          description: Product name being certified
        environment:
          type: string
          description: Target environment (e.g. plo, zek)
        cluster:
          type: string
          description: Kubernetes cluster name
        source:
          $ref: "#/components/schemas/SourceAttestation"
        builds:
          type: array
          items:
            $ref: "#/components/schemas/BuildAttestation"
          description: Build attestations for each service
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageAttestation"
          description: Container image attestations
        charts:
          type: array
          items:
            $ref: "#/components/schemas/ChartAttestation"
          description: Helm chart attestations
        deployment:
          $ref: "#/components/schemas/DeploymentAttestation"
        policy:
          type: string
          default: default
          description: Name of the CertificationPolicy to evaluate against

    CertifyResponse:
      type: object
      description: Result of the certification pipeline
      required:
        - certified
        - certificationHash
        - stages
        - violations
      properties:
        certified:
          type: boolean
          description: Whether the product passed certification
        certificationHash:
          type: string
          description: Deterministic BLAKE3 hash of the entire certification
        complianceHash:
          type: string
          nullable: true
          description: BLAKE3 hash of the compliance dimension
        stages:
          type: array
          items:
            $ref: "#/components/schemas/StageStatus"
          description: Result for each pipeline stage
        violations:
          type: array
          items:
            type: string
          description: List of policy violations found

    StageStatus:
      type: object
      description: Result of a single certification pipeline stage
      required:
        - stage
        - passed
        - hash
        - violations
      properties:
        stage:
          type: string
          description: Stage name (e.g. source, build, image, chart, deployment)
        passed:
          type: boolean
          description: Whether the stage passed
        hash:
          type: string
          description: BLAKE3 hash of the stage attestation data
        violations:
          type: array
          items:
            type: string
          description: Policy violations found in this stage

    SourceAttestation:
      type: object
      description: Attestation of source code integrity
      required:
        - repository
        - commit
        - gitRef
        - commitSigned
        - treeHash
        - flakeLockHash
        - flakeInputCount
        - allInputsPinned
      properties:
        repository:
          type: string
          description: Git repository URL
        commit:
          type: string
          description: Full commit SHA
        gitRef:
          type: string
          description: Git reference (branch or tag)
        commitSigned:
          type: boolean
          description: Whether the commit has a valid GPG/SSH signature
        treeHash:
          type: string
          description: Git tree hash of the commit
        flakeLockHash:
          type: string
          description: BLAKE3 hash of flake.lock
        flakeInputCount:
          type: integer
          description: Number of flake inputs
        allInputsPinned:
          type: boolean
          description: Whether all flake inputs are pinned to exact revisions

    BuildAttestation:
      type: object
      description: Attestation of a build artifact
      required:
        - service
        - derivation
        - closureHash
        - slsaLevel
        - reproducible
        - hermetic
      properties:
        service:
          type: string
          description: Name of the service that was built
        derivation:
          type: string
          description: Nix store derivation path
        closureHash:
          type: string
          description: BLAKE3 hash of the Nix closure
        slsaLevel:
          $ref: "#/components/schemas/SlsaLevel"
        reproducible:
          type: boolean
          description: Whether the build is reproducible
        hermetic:
          type: boolean
          description: Whether the build is hermetic (no network access)
        sbomHash:
          type: string
          nullable: true
          description: BLAKE3 hash of the software bill of materials
        vulnScanHash:
          type: string
          nullable: true
          description: BLAKE3 hash of vulnerability scan results
        cveCount:
          type: integer
          nullable: true
          description: Total number of CVEs found
        criticalHighCves:
          type: integer
          nullable: true
          description: Number of critical and high severity CVEs
        builder:
          type: string
          nullable: true
          description: Builder identity (e.g. nix, bazel)
        builtAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the build completed

    ImageAttestation:
      type: object
      description: Attestation of a container image
      required:
        - imageRef
        - tag
        - architecture
        - manifestHash
        - cosignVerified
      properties:
        imageRef:
          type: string
          description: Full image reference (registry/repo)
        tag:
          type: string
          description: Image tag
        architecture:
          type: string
          description: Target CPU architecture (e.g. amd64, arm64)
        manifestHash:
          type: string
          description: OCI manifest digest
        cosignVerified:
          type: boolean
          description: Whether the image signature was verified with cosign
        signerIdentity:
          type: string
          nullable: true
          description: Identity of the cosign signer
        vulnScanHash:
          type: string
          nullable: true
          description: BLAKE3 hash of vulnerability scan results
        vulnCount:
          type: integer
          nullable: true
          description: Total number of vulnerabilities found
        criticalHighVulns:
          type: integer
          nullable: true
          description: Number of critical and high severity vulnerabilities
        sbomHash:
          type: string
          nullable: true
          description: BLAKE3 hash of the image SBOM

    ChartAttestation:
      type: object
      description: Attestation of a Helm chart
      required:
        - chartName
        - chartVersion
        - chartHash
        - provenanceVerified
        - linterPassed
        - policyPassed
      properties:
        chartName:
          type: string
          description: Helm chart name
        chartVersion:
          type: string
          description: Helm chart version
        chartHash:
          type: string
          description: BLAKE3 hash of the packaged chart
        provenanceVerified:
          type: boolean
          description: Whether the chart provenance file was verified
        dependencyHashes:
          type: array
          items:
            type: string
          nullable: true
          description: BLAKE3 hashes of chart dependencies
        linterPassed:
          type: boolean
          description: Whether the chart passed helm lint
        policyPassed:
          type: boolean
          description: Whether the chart passed OPA/Kyverno policies
        registryRef:
          type: string
          nullable: true
          description: OCI registry reference for the chart

    DeploymentAttestation:
      type: object
      description: Attestation of a Kubernetes deployment
      required:
        - namespace
        - kustomization
        - sourceCommit
        - sourceVerified
        - manifestHash
        - allReleasesSigned
        - networkPoliciesVerified
        - runningPods
        - allHealthy
      properties:
        namespace:
          type: string
          description: Kubernetes namespace
        kustomization:
          type: string
          description: FluxCD Kustomization name
        sourceCommit:
          type: string
          description: Git commit the deployment was sourced from
        sourceVerified:
          type: boolean
          description: Whether the source commit signature was verified
        manifestHash:
          type: string
          description: BLAKE3 hash of rendered Kubernetes manifests
        allReleasesSigned:
          type: boolean
          description: Whether all HelmRelease resources have verified signatures
        cisK8sPassRate:
          type: number
          format: float
          nullable: true
          description: CIS Kubernetes benchmark pass rate (0.0 to 1.0)
        networkPoliciesVerified:
          type: boolean
          description: Whether required NetworkPolicy resources are in place
        runningPods:
          type: integer
          description: Number of running pods in the deployment
        allHealthy:
          type: boolean
          description: Whether all pods are in healthy state

    SlsaLevel:
      type: string
      enum: [L0, L1, L2, L3, L4]
      description: SLSA (Supply-chain Levels for Software Artifacts) level

    # =========================================================================
    # Akeyless Integration Types
    # =========================================================================
    AkeylessSecretAttestation:
      type: object
      description: Attestation of Akeyless secret access during deployment
      required:
        - gatewayUrl
        - authMethod
        - secretsAccessed
        - gatewayCertificateHash
        - sessionHash
      properties:
        gatewayUrl:
          type: string
          description: URL of the Akeyless Gateway
        authMethod:
          $ref: "#/components/schemas/AkeylessAuthMethod"
        secretsAccessed:
          type: array
          items:
            $ref: "#/components/schemas/AkeylessSecretAccess"
          description: List of secrets accessed during deployment
        gatewayCertificateHash:
          type: string
          description: BLAKE3 hash of the gateway TLS certificate
        sessionHash:
          type: string
          description: BLAKE3 hash of the authentication session

    AkeylessAuthMethod:
      type: string
      enum:
        - ApiKey
        - AwsIam
        - AzureAd
        - GcpGce
        - K8s
        - Saml
        - Oidc
        - Certificate
        - Universal
      description: Akeyless authentication method type

    AkeylessSecretAccess:
      type: object
      description: Record of a single Akeyless secret access
      required:
        - path
        - secretType
        - valueHash
        - accessedAt
      properties:
        path:
          type: string
          description: Akeyless secret path
        secretType:
          $ref: "#/components/schemas/AkeylessSecretType"
        valueHash:
          type: string
          description: BLAKE3 hash of the secret value (not the secret itself)
        accessedAt:
          type: string
          format: date-time
          description: Timestamp when the secret was accessed
        version:
          type: integer
          nullable: true
          description: Secret version number

    AkeylessSecretType:
      type: string
      enum:
        - Static
        - DynamicAwsIam
        - DynamicGcp
        - DynamicAzure
        - DynamicK8s
        - DynamicDatabase
        - DynamicCustom
        - RotatedSecret
        - SshCertificate
        - PkiCertificate
      description: Type of Akeyless secret

    # =========================================================================
    # Compliance Dimension Types
    # =========================================================================
    ComplianceAttestation:
      type: object
      description: Multi-dimensional compliance attestation for a deployment artifact
      required:
        - environment
        - artifact
        - dimensions
        - complianceHash
        - computedAt
        - policyName
        - allPassed
      properties:
        environment:
          type: string
          description: Environment being attested
        artifact:
          type: string
          description: Artifact identifier being attested
        dimensions:
          type: array
          items:
            $ref: "#/components/schemas/ComplianceDimension"
          description: Individual compliance dimensions assessed
        complianceHash:
          type: string
          description: BLAKE3 hash of all dimension results combined
        computedAt:
          type: string
          format: date-time
          description: When the attestation was computed
        policyName:
          type: string
          description: Name of the policy applied
        allPassed:
          type: boolean
          description: Whether all required dimensions passed

    ComplianceDimension:
      type: object
      description: A single compliance dimension within an attestation
      required:
        - dimensionType
        - hash
        - passed
        - summary
        - assessedAt
        - required
      properties:
        dimensionType:
          $ref: "#/components/schemas/DimensionType"
        hash:
          type: string
          description: BLAKE3 hash of the dimension assessment data
        passed:
          type: boolean
          description: Whether this dimension passed
        summary:
          type: string
          description: Human-readable summary of the assessment
        assessedAt:
          type: string
          format: date-time
          description: When this dimension was assessed
        required:
          type: boolean
          description: Whether this dimension is required for certification

    DimensionType:
      type: string
      enum:
        - NistAssessment
        - VulnerabilityScan
        - Sbom
        - SlsaProvenance
        - CosignSignature
        - InTotoAttestation
        - CisBenchmark
        - DisaStig
        - Soc2
        - PciDss
        - OwaspAsvs
        - Iso27001
        - FedRamp
        - CsaStar
        - FrameworkSelfAttestation
      description: Type of compliance dimension

    # =========================================================================
    # Policy Types
    # =========================================================================
    CertificationPolicy:
      type: object
      description: Policy defining certification requirements
      required:
        - name
      properties:
        name:
          type: string
          description: Policy name
        requireSignedCommits:
          type: boolean
          nullable: true
          description: Require all commits to be GPG/SSH signed
        requirePinnedInputs:
          type: boolean
          nullable: true
          description: Require all Nix flake inputs to be pinned
        minSlsaLevel:
          $ref: "#/components/schemas/SlsaLevel"
        requireReproducible:
          type: boolean
          nullable: true
          description: Require builds to be reproducible
        maxCriticalHighCves:
          type: integer
          nullable: true
          description: Maximum allowed critical+high CVEs across all builds
        requireImageSignatures:
          type: boolean
          nullable: true
          description: Require all container images to have cosign signatures
        requireChartProvenance:
          type: boolean
          nullable: true
          description: Require Helm chart provenance verification
        requireSourceVerification:
          type: boolean
          nullable: true
          description: Require source commit signature verification
        minCisPassRate:
          type: number
          format: float
          nullable: true
          description: Minimum CIS Kubernetes benchmark pass rate (0.0 to 1.0)
        requireNetworkPolicies:
          type: boolean
          nullable: true
          description: Require NetworkPolicy resources for all namespaces
        requireCompliance:
          type: boolean
          nullable: true
          description: Require compliance assessment to pass

    # =========================================================================
    # Verification Types
    # =========================================================================
    VerificationResult:
      type: object
      description: Result of a signature verification
      required:
        - passed
        - expected
        - actual
        - description
      properties:
        passed:
          type: boolean
          description: Whether verification passed
        expected:
          type: string
          description: Expected signature or hash value
        actual:
          type: string
          description: Actual computed signature or hash value
        description:
          type: string
          description: Human-readable description of what was verified
        layerResults:
          type: array
          items:
            $ref: "#/components/schemas/LayerVerification"
          description: Per-layer verification results

    LayerVerification:
      type: object
      description: Verification result for a single layer
      required:
        - layer
        - passed
        - expected
        - actual
      properties:
        layer:
          $ref: "#/components/schemas/LayerType"
        passed:
          type: boolean
          description: Whether this layer passed verification
        expected:
          type: string
          description: Expected hash for this layer
        actual:
          type: string
          description: Actual computed hash for this layer

    GateDecision:
      type: object
      description: An admission decision made by a signature gate
      required:
        - allowed
        - reason
        - signature
        - expected
        - decidedAt
        - gate
      properties:
        allowed:
          type: boolean
          description: Whether the admission request was allowed
        reason:
          type: string
          description: Human-readable reason for the decision
        signature:
          type: string
          description: Current gate signature at time of decision
        expected:
          type: string
          description: Expected gate signature at time of decision
        decidedAt:
          type: string
          format: date-time
          description: Timestamp of the admission decision
        gate:
          type: string
          description: Name of the gate that made the decision

    # =========================================================================
    # Heartbeat Types
    # =========================================================================
    HeartbeatEntry:
      type: object
      description: Single entry in the heartbeat proof chain
      required:
        - sequence
        - timestamp
        - verifier
        - event
        - result
        - resource
        - signatureChecked
        - entryHash
        - previousHash
      properties:
        sequence:
          type: integer
          format: int64
          description: Monotonically increasing sequence number
        timestamp:
          type: string
          format: date-time
          description: When the heartbeat event occurred
        verifier:
          $ref: "#/components/schemas/VerifierIdentity"
        event:
          $ref: "#/components/schemas/HeartbeatEvent"
        result:
          $ref: "#/components/schemas/VerificationOutcome"
        resource:
          type: string
          description: Identifier of the resource involved (e.g. apps/v1/Deployment/my-app)
        signatureChecked:
          type: string
          description: BLAKE3 signature hash that was checked during this event
        entryHash:
          $ref: "#/components/schemas/Blake3Hash"
        previousHash:
          $ref: "#/components/schemas/Blake3Hash"

    VerifierIdentity:
      type: object
      description: Identity of the component that produced a heartbeat entry
      required:
        - component
        - instance
        - version
      properties:
        component:
          type: string
          description: Component name (e.g. sekiban, kensa, inshou)
        instance:
          type: string
          description: Instance identifier (e.g. pod name, hostname)
        version:
          type: string
          description: Component version

    HeartbeatEvent:
      type: string
      enum:
        - admission_decision
        - gate_verification
        - compliance_assessment
        - certification
        - gate_check
        - binary_verification
        - script_verification
        - break_glass
        - revocation
      description: Type of event recorded in the heartbeat chain

    VerificationOutcome:
      type: string
      enum: [allowed, denied, skipped, error]
      description: Outcome of the verification or admission decision

    ConsistencyProof:
      type: object
      description: Proof that a chain prefix is consistent with a later chain state
      required:
        - fromSeq
        - toSeq
        - fromHash
        - toHash
        - proofNodes
        - verified
      properties:
        fromSeq:
          type: integer
          format: int64
          description: Sequence number of the earlier chain state
        toSeq:
          type: integer
          format: int64
          description: Sequence number of the later chain state
        fromHash:
          $ref: "#/components/schemas/Blake3Hash"
        toHash:
          $ref: "#/components/schemas/Blake3Hash"
        proofNodes:
          type: array
          items:
            type: string
          description: BLAKE3 intermediate hashes forming the consistency proof
        verified:
          type: boolean
          description: Whether the proof has been verified server-side

    ConsistencyProofVerifyRequest:
      type: object
      description: Request to verify a heartbeat consistency proof
      required:
        - proof
        - expectedFromHash
        - expectedToHash
      properties:
        proof:
          $ref: "#/components/schemas/ConsistencyProof"
        expectedFromHash:
          $ref: "#/components/schemas/Blake3Hash"
        expectedToHash:
          $ref: "#/components/schemas/Blake3Hash"

    # =========================================================================
    # Collector Types
    # =========================================================================
    HelmRenderRequest:
      type: object
      description: Request to render and hash a Helm chart
      required:
        - chartPath
        - releaseName
        - namespace
      properties:
        chartPath:
          type: string
          description: Path to the Helm chart directory or packaged chart
        valuesFiles:
          type: array
          items:
            type: string
          description: Paths to values files to apply during rendering
        releaseName:
          type: string
          description: Helm release name to use during rendering
        namespace:
          type: string
          description: Kubernetes namespace for the rendered output

    # =========================================================================
    # Signing Types
    # =========================================================================
    SignRequest:
      type: object
      description: Request to sign a Merkle root
      required:
        - root
        - algorithm
      properties:
        root:
          $ref: "#/components/schemas/Blake3Hash"
        algorithm:
          $ref: "#/components/schemas/SigningAlgorithm"
        keyName:
          type: string
          nullable: true
          description: Key name for remote signing (required for akeyless_dfc)

    SignedRoot:
      type: object
      description: A signed Merkle root with signature metadata
      required:
        - root
        - signature
        - algorithm
        - signerId
        - signedAt
      properties:
        root:
          $ref: "#/components/schemas/Blake3Hash"
        signature:
          type: string
          description: Base64-encoded cryptographic signature
        algorithm:
          $ref: "#/components/schemas/SigningAlgorithm"
        signerId:
          type: string
          description: Identity of the signer (key fingerprint or Akeyless key path)
        signedAt:
          type: string
          format: date-time
          description: Timestamp when the root was signed

    SigningAlgorithm:
      type: string
      enum: [ed25519_local, akeyless_dfc, mock_dfc, break_glass]
      description: Algorithm used to sign a Merkle root

    # =========================================================================
    # Compliance Query Types
    # =========================================================================
    ComplianceState:
      type: object
      description: Aggregate compliance state across all active frameworks
      required:
        - status
        - distance
        - frameworks
        - lastAssessedAt
        - hash
      properties:
        status:
          type: string
          enum: [compliant, non_compliant, partially_compliant, unknown]
          description: Overall compliance status
        distance:
          type: number
          format: float
          description: Aggregate distance from full compliance (0.0 = fully compliant, 1.0 = fully non-compliant)
        frameworks:
          type: array
          items:
            type: string
          description: Active compliance frameworks being assessed
        lastAssessedAt:
          type: string
          format: date-time
          description: Timestamp of the most recent compliance assessment
        hash:
          $ref: "#/components/schemas/Blake3Hash"

    ComplianceDistance:
      type: object
      description: Gap analysis between current state and target baseline for a framework
      required:
        - targetControls
        - satisfied
        - gap
        - percentage
      properties:
        targetControls:
          type: integer
          description: Total number of controls required by the target baseline
        satisfied:
          type: integer
          description: Number of controls currently satisfied
        gap:
          type: integer
          description: Number of unsatisfied controls (targetControls - satisfied)
        percentage:
          type: number
          format: float
          description: Compliance percentage (0.0 to 100.0)

    # =========================================================================
    # Error & Wrapper Types
    # =========================================================================
    ErrorResponse:
      type: object
      description: Standard error response
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
        status:
          type: integer
          nullable: true
          description: HTTP status code

    ApiResponseResultSummaryList:
      type: object
      description: API response wrapping a list of compliance result summaries
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResultSummary"
          description: List of compliance result summaries

    ApiResponseHashResponse:
      type: object
      description: API response wrapping a compliance hash
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/HashResponse"

    ApiResponseRunResponse:
      type: object
      description: API response wrapping a compliance run result
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/RunResponse"

    ApiResponseCertifyResponse:
      type: object
      description: API response wrapping a certification result
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/CertifyResponse"

    # =========================================================================
    # Forensics & Incident Response Types
    # =========================================================================
    BlastRadiusResponse:
      type: object
      description: |
        Blast radius report for a compromised BLAKE3 hash. Enumerates every node,
        pod, namespace, and time window where the hash appeared in any
        CertificationArtifact, plus co-resident artifacts sharing the same Merkle root.
      required:
        - query_hash
        - total_affected
        - time_range
        - affected_nodes
        - co_resident_artifacts
        - chain_integrity
        - evidence_hash
      properties:
        query_hash:
          $ref: "#/components/schemas/Blake3Hash"
        total_affected:
          type: integer
          description: Total number of affected nodes
        time_range:
          type: object
          required:
            - first_seen
            - last_seen
          properties:
            first_seen:
              type: string
              format: date-time
              description: Earliest timestamp the hash was observed in the ledger
            last_seen:
              type: string
              format: date-time
              description: Most recent timestamp the hash was observed in the ledger
        affected_nodes:
          type: array
          items:
            $ref: "#/components/schemas/AffectedNode"
          description: List of nodes where the compromised hash was active
        co_resident_artifacts:
          type: array
          items:
            $ref: "#/components/schemas/CoResidentArtifact"
          description: Other artifacts that shared the same Merkle root as the compromised hash
        merkle_proof:
          type: object
          nullable: true
          description: Inclusion proof for the compromised hash in its Merkle tree
          properties:
            leaf_index:
              type: integer
              description: Index of the compromised hash leaf in the Merkle tree
            proof_nodes:
              type: array
              items:
                $ref: "#/components/schemas/Blake3Hash"
              description: BLAKE3 intermediate hashes forming the inclusion proof
        chain_integrity:
          type: boolean
          description: Whether the ledger hash chain is intact for the queried range
        evidence_hash:
          $ref: "#/components/schemas/Blake3Hash"

    AffectedNode:
      type: object
      description: A node where the compromised hash was active during the queried window
      required:
        - node
        - cluster
        - first_execution
        - last_execution
        - execution_count
        - pods
        - namespaces
      properties:
        node:
          type: string
          description: Node name
        cluster:
          type: string
          description: Cluster name (e.g. plo, zek)
        first_execution:
          type: string
          format: date-time
          description: Earliest execution of the compromised hash on this node
        last_execution:
          type: string
          format: date-time
          description: Most recent execution of the compromised hash on this node
        execution_count:
          type: integer
          description: Total number of verification events involving this hash on this node
        pods:
          type: array
          items:
            type: string
          description: Pod names that ran the compromised hash
        namespaces:
          type: array
          items:
            type: string
          description: Namespaces containing pods that ran the compromised hash

    CoResidentArtifact:
      type: object
      description: An artifact that shared the same Merkle root as the compromised hash
      required:
        - composed_root
        - artifact_hash
        - control_hash
        - intent_hash
        - binary_path
      properties:
        composed_root:
          $ref: "#/components/schemas/Blake3Hash"
        artifact_hash:
          $ref: "#/components/schemas/Blake3Hash"
        control_hash:
          $ref: "#/components/schemas/Blake3Hash"
        intent_hash:
          $ref: "#/components/schemas/Blake3Hash"
        binary_path:
          type: string
          description: Nix store path or binary path of the co-resident artifact

    TimelineResponse:
      type: object
      description: Chronological list of verification events for a specific hash
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"
          description: Ordered list of verification events

    TimelineEvent:
      type: object
      description: A single verification event in the forensics timeline
      required:
        - timestamp
        - event_type
        - decision
        - node
        - pod
        - binary_path
        - composed_root
        - sequence
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the verification event occurred
        event_type:
          $ref: "#/components/schemas/HeartbeatEvent"
        decision:
          $ref: "#/components/schemas/VerificationOutcome"
        node:
          type: string
          description: Node where the event occurred
        pod:
          type: string
          description: Pod that triggered the event
        binary_path:
          type: string
          description: Path of the binary being verified
        composed_root:
          $ref: "#/components/schemas/Blake3Hash"
        sequence:
          type: integer
          format: int64
          description: Ledger sequence number for this event

    ProvenanceResponse:
      type: object
      description: Point-in-time snapshot of all active artifacts on a node
      required:
        - node
        - timestamp
        - active_artifacts
      properties:
        node:
          type: string
          description: Node name queried
        timestamp:
          type: string
          format: date-time
          description: Point-in-time that was queried
        active_artifacts:
          type: array
          items:
            type: object
            required:
              - certification_artifact
              - signed_root
              - deployment_context
            properties:
              certification_artifact:
                type: object
                description: Full CertificationArtifact (3-leaf Merkle binding provenance, compliance, intent)
                required:
                  - artifact_hash
                  - control_hash
                  - intent_hash
                  - composed_root
                properties:
                  artifact_hash:
                    $ref: "#/components/schemas/Blake3Hash"
                  control_hash:
                    $ref: "#/components/schemas/Blake3Hash"
                  intent_hash:
                    $ref: "#/components/schemas/Blake3Hash"
                  composed_root:
                    $ref: "#/components/schemas/Blake3Hash"
              signed_root:
                $ref: "#/components/schemas/SignedRoot"
              deployment_context:
                type: object
                description: Deployment context at the queried timestamp
                required:
                  - cluster
                  - namespace
                  - node
                  - pod
                  - container
                  - image_ref
                  - binary_paths
                properties:
                  cluster:
                    type: string
                    description: Kubernetes cluster name
                  namespace:
                    type: string
                    description: Kubernetes namespace
                  node:
                    type: string
                    description: Node name
                  pod:
                    type: string
                    description: Pod name
                  container:
                    type: string
                    description: Container name
                  image_ref:
                    type: string
                    description: Full container image reference
                  binary_paths:
                    type: array
                    items:
                      type: string
                    description: Nix store paths or binary paths within the container
                  sdlc_chain_hash:
                    $ref: "#/components/schemas/Blake3Hash"
                  compliance_report_hash:
                    $ref: "#/components/schemas/Blake3Hash"
          description: All CertificationArtifacts active on the node at the queried time

    RevokeRequest:
      type: object
      description: Request to revoke a compromised hash across all nodes
      required:
        - hash
        - reason
        - severity
        - operator
      properties:
        hash:
          $ref: "#/components/schemas/Blake3Hash"
        reason:
          type: string
          description: CVE identifier or reason for revocation (e.g. CVE-2026-XXXX)
        severity:
          type: string
          enum: [low, medium, high, critical]
          description: Severity of the incident
        operator:
          type: string
          description: Identity of the operator performing the revocation (e.g. email)

    RevokeResponse:
      type: object
      description: Result of a hash revocation operation
      required:
        - revoked
        - affected_nodes
        - bpf_maps_updated
        - heartbeat_entry_sequence
      properties:
        revoked:
          type: boolean
          description: Whether the revocation was successfully applied
        affected_nodes:
          type: integer
          description: Number of nodes where the hash was revoked
        bpf_maps_updated:
          type: boolean
          description: Whether kanshi BPF allow-maps were updated on all affected nodes
        heartbeat_entry_sequence:
          type: integer
          format: int64
          description: Sequence number of the Revocation event in the HeartbeatChain

    # =========================================================================
    # Global Types
    # =========================================================================
    GlobalStateRootResponse:
      type: object
      description: Global state root aggregating all cluster roots
      required:
        - root_hash
        - cluster_roots
        - computed_at
        - sequence
        - previous_root
      properties:
        root_hash:
          $ref: "#/components/schemas/Blake3Hash"
        cluster_roots:
          type: object
          description: Per-cluster state, keyed by cluster_id
          additionalProperties:
            $ref: "#/components/schemas/ClusterRootEntry"
        computed_at:
          type: string
          format: date-time
          description: When this global root was computed
        sequence:
          type: integer
          format: int64
          description: Monotonically increasing sequence number
        previous_root:
          $ref: "#/components/schemas/Blake3Hash"

    ClusterRootEntry:
      type: object
      description: A single cluster's contribution to the global state root
      required:
        - cluster_id
        - cluster_root
        - signed_root
        - node_count
        - artifact_count
        - last_reported
        - status
      properties:
        cluster_id:
          type: string
          description: Unique cluster identifier (e.g. plo-us-east, edge-fleet-07)
        cluster_root:
          $ref: "#/components/schemas/Blake3Hash"
        signed_root:
          $ref: "#/components/schemas/SignedRoot"
        node_count:
          type: integer
          description: Number of nodes reporting attestations
        artifact_count:
          type: integer
          format: int64
          description: Total number of CertificationArtifacts across all nodes
        last_reported:
          type: string
          format: date-time
          description: Last time this cluster reported its root
        status:
          $ref: "#/components/schemas/ClusterStatus"

    ClusterStatus:
      type: string
      description: Cluster liveness status
      enum: [active, stale, offline, revoked]

    GlobalBlastRadiusResponse:
      type: object
      description: Global blast radius report aggregating across all clusters
      required:
        - query_hash
        - total_clusters_affected
        - total_nodes_affected
        - total_pods_affected
        - clusters_not_affected
        - cluster_reports
      properties:
        query_hash:
          $ref: "#/components/schemas/Blake3Hash"
        total_clusters_affected:
          type: integer
          description: Total clusters containing the compromised artifact
        total_nodes_affected:
          type: integer
          description: Total nodes across all affected clusters
        total_pods_affected:
          type: integer
          description: Total pods across all affected clusters
        clusters_not_affected:
          type: array
          items:
            type: string
          description: Clusters confirmed NOT affected
        cluster_reports:
          type: array
          items:
            $ref: "#/components/schemas/ClusterBlastRadius"
        global_first_seen:
          type: string
          format: date-time
          description: Earliest attestation of this hash across all clusters
        global_last_seen:
          type: string
          format: date-time
          description: Most recent attestation of this hash across all clusters

    ClusterBlastRadius:
      type: object
      description: Per-cluster blast radius detail
      required:
        - cluster_id
        - nodes_affected
        - pods_affected
        - first_seen
        - last_seen
        - node_details
      properties:
        cluster_id:
          type: string
          description: Cluster identifier
        nodes_affected:
          type: integer
          description: Number of affected nodes in this cluster
        pods_affected:
          type: integer
          description: Number of affected pods in this cluster
        first_seen:
          type: string
          format: date-time
          description: First attestation in this cluster
        last_seen:
          type: string
          format: date-time
          description: Most recent attestation in this cluster
        node_details:
          type: array
          items:
            $ref: "#/components/schemas/NodeBlastRadius"

    NodeBlastRadius:
      type: object
      description: Per-node blast radius detail
      required:
        - node
        - pods
        - binary_paths
        - first_execution
        - last_execution
        - execution_count
      properties:
        node:
          type: string
          description: Node identifier
        pods:
          type: array
          items:
            type: string
          description: Affected pods on this node
        binary_paths:
          type: array
          items:
            type: string
          description: Binary paths containing the compromised artifact
        first_execution:
          type: string
          format: date-time
          description: First execution on this node
        last_execution:
          type: string
          format: date-time
          description: Most recent execution on this node
        execution_count:
          type: integer
          format: int64
          description: Total execution count

    ClusterRootReport:
      type: object
      description: Report sent by a local cluster to the master server
      required:
        - cluster_id
        - cluster_root
        - signed_root
        - node_count
        - artifact_count
        - reported_at
      properties:
        cluster_id:
          type: string
          description: Unique cluster identifier
        cluster_root:
          $ref: "#/components/schemas/Blake3Hash"
        signed_root:
          $ref: "#/components/schemas/SignedRoot"
        node_count:
          type: integer
          description: Number of nodes reporting attestations
        artifact_count:
          type: integer
          format: int64
          description: Total number of CertificationArtifacts across all nodes
        reported_at:
          type: string
          format: date-time
          description: When this report was generated
        artifact_delta:
          $ref: "#/components/schemas/ArtifactDelta"

    ArtifactDelta:
      type: object
      description: Delta of artifacts since last report (bandwidth optimization)
      required:
        - added
        - removed
      properties:
        added:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactLocation"
          description: Artifacts added since last report
        removed:
          type: array
          items:
            $ref: "#/components/schemas/Blake3Hash"
          description: Composed root hashes of artifacts removed since last report

    ArtifactLocation:
      type: object
      description: Location of an artifact in the global fleet
      required:
        - cluster_id
        - node
        - namespace
        - pod
        - binary_path
        - composed_root
      properties:
        cluster_id:
          type: string
          description: Cluster where the artifact resides
        node:
          type: string
          description: Node within the cluster
        namespace:
          type: string
          description: Kubernetes namespace
        pod:
          type: string
          description: Pod name
        binary_path:
          type: string
          description: Path to the binary on disk
        composed_root:
          $ref: "#/components/schemas/Blake3Hash"

    GlobalRevokeResponse:
      type: object
      description: Aggregate result of revoking a hash across all clusters
      required:
        - total_clusters_revoked
        - total_nodes_affected
        - total_bpf_maps_updated
        - cluster_results
      properties:
        total_clusters_revoked:
          type: integer
          description: Number of clusters where revocation was applied
        total_nodes_affected:
          type: integer
          description: Total nodes across all clusters where hash was revoked
        total_bpf_maps_updated:
          type: integer
          description: Total BPF maps updated across all clusters
        cluster_results:
          type: array
          items:
            $ref: "#/components/schemas/RevokeResponse"
          description: Per-cluster revocation results

    StorageTier:
      type: string
      description: Storage tier for ledger data lifecycle
      enum: [hot, warm, cold, archive]

    StorageStats:
      type: object
      description: Statistics about ledger storage usage across tiers
      required:
        - total_entries
        - hot_entries
        - warm_entries
        - cold_entries
        - archive_entries
        - total_bytes
      properties:
        total_entries:
          type: integer
          format: int64
          description: Total number of ledger entries across all tiers
        hot_entries:
          type: integer
          format: int64
          description: Entries in the hot tier (in-memory, fast access)
        warm_entries:
          type: integer
          format: int64
          description: Entries in the warm tier (local SSD)
        cold_entries:
          type: integer
          format: int64
          description: Entries in the cold tier (S3/object storage)
        archive_entries:
          type: integer
          format: int64
          description: Entries in the archive tier (Glacier/deep archive)
        total_bytes:
          type: integer
          format: int64
          description: Total storage consumed across all tiers in bytes

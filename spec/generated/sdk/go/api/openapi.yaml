openapi: 3.0.3
info:
  contact:
    name: pleme-io
    url: https://github.com/pleme-io/tameshi
  description: |
    Deterministic integrity attestation and compliance verification for infrastructure.

    Tameshi unifies two complementary services:

    - **sekiban** -- Kubernetes integrity gating via deterministic BLAKE3 signature
      verification across infrastructure layers (Nix, OCI, Helm, Tofu, etc.).
    - **kensa** -- Compliance engine that runs NIST/OSCAL assessments and drives a
      multi-stage product certification pipeline.

    Together they provide a cryptographically verifiable chain from source code
    through build, image, chart, deployment, and compliance -- producing a single
    certification hash that attests the entire stack.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Tameshi Attestation Platform API
  version: 0.1.0
servers:
- description: "sekiban API -- signature gates, certifications, audit"
  url: http://localhost:8080
- description: "kensa API -- compliance engine, reports, certification pipeline"
  url: http://localhost:8081
tags:
- description: Signature gate management (sekiban)
  name: gates
- description: Environment certification (sekiban)
  name: certifications
- description: Audit trail (sekiban)
  name: audit
- description: Signature computation (sekiban)
  name: signatures
- description: Compliance results (kensa)
  name: compliance
- description: Compliance reports (kensa)
  name: reports
- description: Product certification pipeline (kensa)
  name: certification-pipeline
- description: Health and readiness probes
  name: health
paths:
  /api/v1/gates:
    get:
      description: Returns a summary of every SignatureGate resource across all namespaces.
      operationId: listGates
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/GateSummary"
                type: array
          description: List of gate summaries
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: List all signature gates
      tags:
      - gates
  /api/v1/gates/{name}:
    get:
      description: Returns the full SignatureGate resource including spec and status.
      operationId: getGate
      parameters:
      - description: Name of the SignatureGate resource
        explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignatureGate"
          description: The requested signature gate
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Gate not found
      summary: Get a signature gate by name
      tags:
      - gates
  /api/v1/gates/{name}/verify:
    get:
      description: |
        Triggers an immediate verification of the gate by recomputing each layer
        hash and comparing the composite signature against the expected value.
      operationId: verifyGate
      parameters:
      - description: Name of the SignatureGate resource to verify
        explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateVerifyResult"
          description: Verification result
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Gate not found
      summary: Verify a signature gate
      tags:
      - gates
  /api/v1/certifications:
    get:
      description: Returns a summary of every Certification resource across all namespaces.
      operationId: listCertifications
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CertificationSummary"
                type: array
          description: List of certification summaries
      summary: List all certifications
      tags:
      - certifications
  /api/v1/certifications/{name}:
    get:
      description: Returns the full Certification resource including spec and status.
      operationId: getCertification
      parameters:
      - description: Name of the Certification resource
        explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"
          description: The requested certification
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Certification not found
      summary: Get certification by name
      tags:
      - certifications
  /api/v1/audit/{environment}:
    get:
      description: Returns the ordered list of audit entries for the specified environment.
      operationId: getAuditTrail
      parameters:
      - description: "Environment name (e.g. plo, zek)"
        explode: false
        in: path
        name: environment
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AuditEntry"
                type: array
          description: Audit trail entries in chronological order
      summary: Get audit trail for environment
      tags:
      - audit
  /api/v1/signatures/compute:
    post:
      description: |
        Computes a deterministic BLAKE3 composite signature from the requested
        infrastructure layers for the given environment.
      operationId: computeSignature
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputeSignatureRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputeSignatureResponse"
          description: Computed signature
      summary: Compute a signature
      tags:
      - signatures
  /api/v1/compliance/results:
    get:
      description: Returns summaries of all compliance assessment results.
      operationId: listComplianceResults
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseResultSummaryList"
          description: List of compliance result summaries
      summary: List compliance results
      tags:
      - compliance
  /api/v1/compliance/results/{id}:
    get:
      description: Returns the full compliance result including assessment details.
      operationId: getComplianceResult
      parameters:
      - description: Unique identifier of the compliance result
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceResult"
          description: The requested compliance result
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Compliance result not found
      summary: Get compliance result by ID
      tags:
      - compliance
  /api/v1/compliance/hash:
    get:
      description: Returns the BLAKE3 hash of the most recent compliance assessment.
      operationId: getComplianceHash
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseHashResponse"
          description: Latest compliance hash
      summary: Get latest compliance hash
      tags:
      - compliance
  /api/v1/compliance/run:
    post:
      description: Triggers a new compliance assessment run against the configured
        baseline.
      operationId: runComplianceAssessment
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRunResponse"
          description: Assessment run initiated
      summary: Run compliance assessment
      tags:
      - compliance
  /api/v1/compliance/report:
    get:
      description: |
        Generates a compliance report in the requested format. Supports OSCAL
        and NIST output formats.
      operationId: getComplianceReport
      parameters:
      - description: Report output format
        explode: true
        in: query
        name: format
        required: false
        schema:
          default: oscal
          enum:
          - oscal
          - nist
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                description: Report content in the requested format (OSCAL or NIST
                  JSON)
                type: object
          description: Generated compliance report
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid format parameter
      summary: Generate compliance report
      tags:
      - reports
  /api/v1/compliance/certify:
    post:
      description: |
        Runs the multi-stage certification pipeline for a product deployment.
        Evaluates source, build, image, chart, and deployment attestations
        against the specified policy, producing a deterministic certification hash.
      operationId: certifyProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCertifyResponse"
          description: Certification result
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request
      summary: Certify a product
      tags:
      - certification-pipeline
  /healthz:
    get:
      description: Returns 200 when the service process is alive.
      operationId: healthz
      responses:
        "200":
          description: Service is alive
      summary: Liveness probe
      tags:
      - health
  /readyz:
    get:
      description: "Returns 200 when the service is ready to accept traffic, 503 otherwise."
      operationId: readyz
      responses:
        "200":
          description: Service is ready
        "503":
          description: Service is not ready
      summary: Readiness probe
      tags:
      - health
components:
  schemas:
    Blake3Hash:
      description: BLAKE3 hash in prefixed hex format
      example: blake3:af1349b9f5f9a1a6a0404dea36dcc9499bcb25c9adc112b7cc9a93cae41f3262
      pattern: "^blake3:[a-f0-9]{64}$"
      type: string
    LayerType:
      description: Infrastructure layer type used for signature computation
      enum:
      - nix
      - oci
      - helm
      - tofu
      - kubernetes
      - kindling
      - tatara
      - fluxcd
      - argocd
      - akeyless
      type: string
    GateSummary:
      description: Abbreviated view of a SignatureGate for list responses
      example:
        phase: Pending
        currentSignature: currentSignature
        name: name
        namespace: namespace
        layers:
        - nix
        - nix
        expectedSignature: expectedSignature
      properties:
        name:
          description: Name of the SignatureGate resource
          type: string
        namespace:
          description: Kubernetes namespace
          type: string
        phase:
          $ref: "#/components/schemas/GatePhase"
        layers:
          description: Infrastructure layers this gate covers
          items:
            $ref: "#/components/schemas/LayerType"
          type: array
        expectedSignature:
          description: Expected composite signature
          nullable: true
          type: string
        currentSignature:
          description: Most recently computed composite signature
          nullable: true
          type: string
      required:
      - layers
      - name
      - namespace
      - phase
      type: object
    SignatureGate:
      description: Full SignatureGate resource with spec and status
      example:
        name: name
        namespace: namespace
        spec:
          layers:
          - nix
          - nix
          expectedSignature: expectedSignature
          compliancePolicy: compliancePolicy
          targetResources:
          - operations:
            - operations
            - operations
            kind: kind
            group: group
          - operations:
            - operations
            - operations
            kind: kind
            group: group
          verificationIntervalSecs: 0
          expectedCertificationHash: expectedCertificationHash
        status:
          phase: Pending
          currentSignature: currentSignature
          admissionDecisions:
            allowed: 1
            denied: 5
          layerStatuses:
          - verified: true
            lastVerifiedAt: 2000-01-23T04:56:07.000+00:00
            error: error
            layer: null
            hash: hash
          - verified: true
            lastVerifiedAt: 2000-01-23T04:56:07.000+00:00
            error: error
            layer: null
            hash: hash
          lastVerifiedAt: 2000-01-23T04:56:07.000+00:00
          message: message
          failureCount: 6
      properties:
        name:
          description: Name of the SignatureGate resource
          type: string
        namespace:
          description: Kubernetes namespace
          type: string
        spec:
          $ref: "#/components/schemas/SignatureGateSpec"
        status:
          $ref: "#/components/schemas/SignatureGateStatus"
      required:
      - name
      - namespace
      - spec
      - status
      type: object
    SignatureGateSpec:
      description: Desired state of a SignatureGate
      example:
        layers:
        - nix
        - nix
        expectedSignature: expectedSignature
        compliancePolicy: compliancePolicy
        targetResources:
        - operations:
          - operations
          - operations
          kind: kind
          group: group
        - operations:
          - operations
          - operations
          kind: kind
          group: group
        verificationIntervalSecs: 0
        expectedCertificationHash: expectedCertificationHash
      properties:
        layers:
          description: Infrastructure layers to include in signature computation
          items:
            $ref: "#/components/schemas/LayerType"
          type: array
        expectedSignature:
          description: Expected deterministic composite signature
          type: string
        targetResources:
          description: Kubernetes resources this gate controls admission for
          items:
            $ref: "#/components/schemas/TargetResource"
          type: array
        compliancePolicy:
          description: Name of the CertificationPolicy to enforce
          nullable: true
          type: string
        expectedCertificationHash:
          description: Expected certification hash from the compliance engine
          nullable: true
          type: string
        verificationIntervalSecs:
          description: How often to re-verify the gate in seconds
          nullable: true
          type: integer
      required:
      - expectedSignature
      - layers
      type: object
    SignatureGateStatus:
      description: Observed state of a SignatureGate
      example:
        phase: Pending
        currentSignature: currentSignature
        admissionDecisions:
          allowed: 1
          denied: 5
        layerStatuses:
        - verified: true
          lastVerifiedAt: 2000-01-23T04:56:07.000+00:00
          error: error
          layer: null
          hash: hash
        - verified: true
          lastVerifiedAt: 2000-01-23T04:56:07.000+00:00
          error: error
          layer: null
          hash: hash
        lastVerifiedAt: 2000-01-23T04:56:07.000+00:00
        message: message
        failureCount: 6
      properties:
        phase:
          $ref: "#/components/schemas/GatePhase"
        currentSignature:
          description: Most recently computed composite signature
          nullable: true
          type: string
        lastVerifiedAt:
          description: Timestamp of the last successful verification
          format: date-time
          nullable: true
          type: string
        layerStatuses:
          description: Per-layer verification status
          items:
            $ref: "#/components/schemas/LayerStatus"
          type: array
        message:
          description: Human-readable status message
          nullable: true
          type: string
        failureCount:
          description: Number of consecutive verification failures
          nullable: true
          type: integer
        admissionDecisions:
          $ref: "#/components/schemas/AdmissionDecisionCounts"
      required:
      - phase
      type: object
    GatePhase:
      description: Current phase of a signature gate
      enum:
      - Pending
      - Verified
      - Failed
      - Stale
      type: string
    TargetResource:
      description: Kubernetes resource targeted by a gate for admission control
      example:
        operations:
        - operations
        - operations
        kind: kind
        group: group
      properties:
        group:
          description: "API group (e.g. apps, batch, empty string for core)"
          type: string
        kind:
          description: "Resource kind (e.g. Deployment, Job)"
          type: string
        operations:
          description: "Admission operations to intercept (CREATE, UPDATE, DELETE)"
          items:
            type: string
          type: array
      required:
      - group
      - kind
      - operations
      type: object
    LayerStatus:
      description: Verification status for a single infrastructure layer
      example:
        verified: true
        lastVerifiedAt: 2000-01-23T04:56:07.000+00:00
        error: error
        layer: null
        hash: hash
      properties:
        layer:
          $ref: "#/components/schemas/LayerType"
        hash:
          description: Computed BLAKE3 hash for this layer
          type: string
        verified:
          description: Whether the layer hash matches the expected value
          type: boolean
        lastVerifiedAt:
          description: Timestamp of the last verification for this layer
          format: date-time
          nullable: true
          type: string
        error:
          description: Error message if verification failed
          nullable: true
          type: string
      required:
      - hash
      - layer
      - verified
      type: object
    AdmissionDecisionCounts:
      description: Running counts of admission decisions made by this gate
      example:
        allowed: 1
        denied: 5
      properties:
        allowed:
          description: Number of requests allowed through the gate
          type: integer
        denied:
          description: Number of requests denied by the gate
          type: integer
      type: object
    GateVerifyResult:
      description: Result of an on-demand gate verification
      example:
        phase: Pending
        currentSignature: currentSignature
        layerStatuses:
        - verified: true
          lastVerifiedAt: 2000-01-23T04:56:07.000+00:00
          error: error
          layer: null
          hash: hash
        - verified: true
          lastVerifiedAt: 2000-01-23T04:56:07.000+00:00
          error: error
          layer: null
          hash: hash
        name: name
        verified: true
        expectedSignature: expectedSignature
      properties:
        name:
          description: Name of the verified gate
          type: string
        verified:
          description: Whether the gate passed verification
          type: boolean
        phase:
          $ref: "#/components/schemas/GatePhase"
        expectedSignature:
          description: The expected composite signature
          nullable: true
          type: string
        currentSignature:
          description: The freshly computed composite signature
          nullable: true
          type: string
        layerStatuses:
          description: Per-layer verification results
          items:
            $ref: "#/components/schemas/LayerStatus"
          type: array
      required:
      - name
      - phase
      - verified
      type: object
    CertificationSummary:
      description: Abbreviated view of a Certification for list responses
      example:
        phase: Pending
        gates:
        - gates
        - gates
        environment: environment
        name: name
        namespace: namespace
        masterSignature: masterSignature
      properties:
        name:
          description: Name of the Certification resource
          type: string
        namespace:
          description: Kubernetes namespace
          type: string
        environment:
          description: "Target environment (e.g. plo, zek)"
          type: string
        phase:
          $ref: "#/components/schemas/CertPhase"
        gates:
          description: Names of the SignatureGates included in this certification
          items:
            type: string
          type: array
        masterSignature:
          description: Composite master signature across all gates
          nullable: true
          type: string
      required:
      - environment
      - name
      - namespace
      - phase
      type: object
    Certification:
      description: Full Certification resource with spec and status
      example:
        name: name
        namespace: namespace
        spec:
          gates:
          - gates
          - gates
          environment: environment
          auditRetentionDays: 0
        status:
          phase: Pending
          gateStatuses:
          - phase: Pending
            lastCheckedAt: 2000-01-23T04:56:07.000+00:00
            name: name
            verified: true
          - phase: Pending
            lastCheckedAt: 2000-01-23T04:56:07.000+00:00
            name: name
            verified: true
          masterSignature: masterSignature
          lastCertifiedAt: 2000-01-23T04:56:07.000+00:00
          complianceSignature: complianceSignature
          auditTrail:
          - signature: signature
            resource: resource
            allowed: true
            action: SignatureComputed
            details: details
            timestamp: 2000-01-23T04:56:07.000+00:00
          - signature: signature
            resource: resource
            allowed: true
            action: SignatureComputed
            details: details
            timestamp: 2000-01-23T04:56:07.000+00:00
          secureSignature: secureSignature
      properties:
        name:
          description: Name of the Certification resource
          type: string
        namespace:
          description: Kubernetes namespace
          type: string
        spec:
          $ref: "#/components/schemas/CertificationSpec"
        status:
          $ref: "#/components/schemas/CertificationStatus"
      required:
      - name
      - namespace
      - spec
      - status
      type: object
    CertificationSpec:
      description: Desired state of a Certification
      example:
        gates:
        - gates
        - gates
        environment: environment
        auditRetentionDays: 0
      properties:
        environment:
          description: Target environment name
          type: string
        gates:
          description: Names of SignatureGate resources to include
          items:
            type: string
          type: array
        auditRetentionDays:
          description: Number of days to retain audit trail entries
          nullable: true
          type: integer
      required:
      - environment
      - gates
      type: object
    CertificationStatus:
      description: Observed state of a Certification
      example:
        phase: Pending
        gateStatuses:
        - phase: Pending
          lastCheckedAt: 2000-01-23T04:56:07.000+00:00
          name: name
          verified: true
        - phase: Pending
          lastCheckedAt: 2000-01-23T04:56:07.000+00:00
          name: name
          verified: true
        masterSignature: masterSignature
        lastCertifiedAt: 2000-01-23T04:56:07.000+00:00
        complianceSignature: complianceSignature
        auditTrail:
        - signature: signature
          resource: resource
          allowed: true
          action: SignatureComputed
          details: details
          timestamp: 2000-01-23T04:56:07.000+00:00
        - signature: signature
          resource: resource
          allowed: true
          action: SignatureComputed
          details: details
          timestamp: 2000-01-23T04:56:07.000+00:00
        secureSignature: secureSignature
      properties:
        phase:
          $ref: "#/components/schemas/CertPhase"
        masterSignature:
          description: Composite master signature across all gates
          nullable: true
          type: string
        complianceSignature:
          description: BLAKE3 hash of the compliance assessment result
          nullable: true
          type: string
        secureSignature:
          description: BLAKE3 hash combining master and compliance signatures
          nullable: true
          type: string
        lastCertifiedAt:
          description: Timestamp of the last successful certification
          format: date-time
          nullable: true
          type: string
        gateStatuses:
          description: Status of each gate included in this certification
          items:
            $ref: "#/components/schemas/GateStatusRef"
          type: array
        auditTrail:
          description: Ordered audit trail for this certification
          items:
            $ref: "#/components/schemas/AuditEntry"
          type: array
      required:
      - phase
      type: object
    CertPhase:
      description: Current phase of a certification
      enum:
      - Pending
      - Certified
      - Degraded
      - Failed
      type: string
    GateStatusRef:
      description: Reference to a gate's status within a certification
      example:
        phase: Pending
        lastCheckedAt: 2000-01-23T04:56:07.000+00:00
        name: name
        verified: true
      properties:
        name:
          description: Name of the referenced SignatureGate
          type: string
        verified:
          description: Whether the gate is currently verified
          type: boolean
        phase:
          $ref: "#/components/schemas/GatePhase"
        lastCheckedAt:
          description: Timestamp of the last status check
          format: date-time
          nullable: true
          type: string
      required:
      - name
      - phase
      - verified
      type: object
    AuditEntry:
      description: Single entry in the audit trail
      example:
        signature: signature
        resource: resource
        allowed: true
        action: SignatureComputed
        details: details
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        timestamp:
          description: When the audit event occurred
          format: date-time
          type: string
        action:
          $ref: "#/components/schemas/AuditAction"
        signature:
          description: Signature associated with this audit event
          type: string
        details:
          description: Human-readable details about the event
          nullable: true
          type: string
        resource:
          description: Kubernetes resource involved (e.g. apps/v1/Deployment/my-app)
          nullable: true
          type: string
        allowed:
          description: Whether the operation was allowed (for admission events)
          nullable: true
          type: boolean
      required:
      - action
      - signature
      - timestamp
      type: object
    AuditAction:
      description: Type of audit action
      enum:
      - SignatureComputed
      - SignatureVerified
      - VerificationFailed
      - ComplianceTestRun
      - Certified
      - Degraded
      - GateAllowed
      - GateDenied
      type: string
    ComputeSignatureRequest:
      description: Request to compute a deterministic composite signature
      example:
        environment: environment
        layers:
        - nix
        - nix
      properties:
        layers:
          description: Infrastructure layers to include in the computation
          items:
            $ref: "#/components/schemas/LayerType"
          type: array
        environment:
          description: Target environment name
          type: string
      required:
      - environment
      - layers
      type: object
    ComputeSignatureResponse:
      description: Result of a signature computation
      example:
        environment: environment
        signature: signature
        layers:
        - layers
        - layers
      properties:
        signature:
          description: Computed BLAKE3 composite signature
          type: string
        layers:
          description: Layer types that contributed to the signature
          items:
            type: string
          type: array
        environment:
          description: Environment the signature was computed for
